  <text x="620" y="200" text-anchor="middle" fill="#EDF1F5" font-size="15" font-weight="700" letter-spacing="1.5">REACH</text>
  <text x="620" y="222" text-anchor="middle" fill="#7C8694" font-size="10.5" font-family="'JetBrains Mono',ui-monospace,monospace" letter-spacing="0.4">Outreach</text>

  <!-- 4. GROW -->
  <g transform="translate(822 95) scale(0.75)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14,40 H30 M30,40 L48,26 M30,40 L48,54 M48,26 L64,18 M48,26 L64,34 M48,54 L64,46 M48,54 L64,62" stroke="#F0833A"/>
    <circle cx="14" cy="40" r="2.8" fill="#F0833A" stroke="none"/>
    <circle cx="64" cy="18" r="2.8" fill="#F0833A" stroke="none"/>
    <circle cx="64" cy="34" r="2.8" fill="#F0833A" stroke="none"/>
    <circle cx="64" cy="46" r="2.8" fill="#F0833A" stroke="none"/>
    <circle cx="64" cy="62" r="2.8" fill="#F0833A" stroke="none"/>
  </g>
  <text x="852" y="200" text-anchor="middle" fill="#EDF1F5" font-size="15" font-weight="700" letter-spacing="1.5">GROW</text>
  <text x="852" y="222" text-anchor="middle" fill="#7C8694" font-size="10.5" font-family="'JetBrains Mono',ui-monospace,monospace" letter-spacing="0.4">Onboard &amp; retain</text>

  <!-- 5. EMBARK (future · dim) -->
  <g transform="translate(1054 95) scale(0.75)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
    <path d="M20,36 A 21 21 0 0 1 56,27" stroke="#7C8694"/>
    <path d="M56,27 L48.5,25.2 M56,27 L54.6,33.4" stroke="#7C8694"/>
    <path d="M60,44 A 21 21 0 0 1 24,53" stroke="#7C8694"/>
    <path d="M24,53 L31.5,54.8 M24,53 L25.4,46.6" stroke="#7C8694"/>
  </g>
  <text x="1084" y="200" text-anchor="middle" fill="#7C8694" font-size="15" font-weight="700" letter-spacing="1.5">EMBARK</text>
  <text x="1084" y="222" text-anchor="middle" fill="#525B67" font-size="10.5" font-family="'JetBrains Mono',ui-monospace,monospace" letter-spacing="0.4">Future &#183; out of scope</text>

  <rect x="40" y="262" width="1160" height="3" rx="1.5" fill="url(#fg-ember)" opacity="0.85"/>
</svg>
